<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Index</title>
</head>
<body>
    <h1>Type your text below: </h1>
    <form method="POST" action=["right","left","up","down"] >
        {% csrf_token %}
        <textarea name="text" rows="10" cols="20"></textarea><br>
        <input type="submit"/>
    </form>
    <form method="POST" action="" >
        {% csrf_token %}
        <textarea name="text" rows="10" cols="20"></textarea><br>
        <input type="submit"/>
    </form>
    <form method="POST" action="up" >
        {% csrf_token %}
        <textarea name="text" rows="10" cols="20"></textarea><br>
        <input type="submit"/>
    </form>
    <form method="POST" action="down" >
        {% csrf_token %}
        <textarea name="text" rows="10" cols="20"></textarea><br>
        <input type="submit"/>
    </form>
</body>
</html>
