apiVersion: v1
kind: Pod
metadata:
  annotations:
    # Enter NAD details for SRIOV Kernel vNICBindingType
    k8s.v1.cni.cncf.io/networks: sriov-nad-v6-kw
  labels:
    name: server-pod
    owner: touchstone
    role: server
  name: server-pod
spec:
  containers:
  - image: voereir/touchstone-server-ubuntu:v4.2.0
    imagePullPolicy: IfNotPresent
    name: container-server-pod
    resources:
      limits:
        cpu: 4000m
        memory: 4000Mi
        # Add Resource name with number of direct ports
        intel.com/intel_sriov_netdevice: '1'
      requests:
        cpu: 4000m
        memory: 4000Mi
    securityContext:
      privileged: true
      runAsUser: 0
      capabilities:
        add:
        - NET_ADMIN
        - IPC_LOCK
