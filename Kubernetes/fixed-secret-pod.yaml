apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: secret-handler
  name: secret-handler
spec:
  containers:
  - image: nginx
    name: secret-handler
    resources: {}
    env:
    - name: SECRET1_USER
      valueFrom:
        secretKeyRef:
          name: secret1
    key: user
